apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: hookflow-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      httpMethod: POST

  # P3-36b — see monitoring/README.md "Logs" and docs/runbooks/trace-webhook-logs.md
  - name: Loki
    type: loki
    uid: hookflow-loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
