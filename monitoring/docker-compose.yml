# Hookflow Monitoring Stack
# Decoupled from the main platform — connects to the same Docker network.
#
# Usage:
#   make monitoring-up      (from project root)
#   make monitoring-down
#
# Or manually:
#   docker compose -f monitoring/docker-compose.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: hookflow-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      - hookflow
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:10.4.2
    container_name: hookflow-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-hookflow}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-hookflow_monitor_2024}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hookflow-overview.json
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - monitoring
      - hookflow
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
  hookflow:
    external: true
    name: webhook-platform_webhook-network
