# ============================================================================
# Pull-based quick start — no Maven/npm toolchain, no repo clone required.
# ============================================================================
# Unlike docker-compose.yml (build: contexts) and docker-compose.prod.yml (an
# *overlay* that still needs docker-compose.yml present for its base service
# definitions), this file is fully self-contained: every service resolves to
# a pre-built image, so it works with nothing but this file plus a .env next
# to it (copy .env.dist -> .env and fill in the secrets).
#
#   curl -fsSLO https://raw.githubusercontent.com/vadymkykalo/webhook-platform/main/docker-compose.pull.yml
#   curl -fsSL https://raw.githubusercontent.com/vadymkykalo/webhook-platform/main/.env.dist -o .env
#   # edit .env: set WEBHOOK_ENCRYPTION_KEY / WEBHOOK_ENCRYPTION_SALT / JWT_SECRET / *_PASSWORD
#   docker compose -f docker-compose.pull.yml up -d
#   curl -f http://localhost:8082/actuator/health/liveness   # actuator: separate port, see MANAGEMENT_PORT below
#   curl -f http://localhost:5173
#
# Images default to the images this project publishes to GHCR on every
# version tag (see .github/workflows/docker-publish.yml). Override
# DOCKER_REGISTRY / API_IMAGE_TAG / WORKER_IMAGE_TAG / UI_IMAGE_TAG (all
# documented in .env.dist, shared with docker-compose.prod.yml) to point at a
# private mirror or a specific version instead of :latest.
#
# Kafka topic creation, which `make up` normally does as a separate Makefile
# step after startup, runs here as the one-shot `kafka-init` service — api and
# worker wait for it to complete successfully before starting, so there is no
# "app started before topics existed" race.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: webhook-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webhook_platform}
      POSTGRES_USER: ${POSTGRES_USER:-webhook_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhook_pass}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_VOLUME_NAME:-webhook_pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webhook_user} -d ${POSTGRES_DB:-webhook_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: "${POSTGRES_MEMORY_LIMIT:-1G}"
        reservations:
          memory: "256m"
    networks:
      - webhook-network
    restart: unless-stopped

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.7.0}
    container_name: webhook-kafka
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-12}
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      CLUSTER_ID: webhook-kafka-cluster
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: "${KAFKA_MEMORY_LIMIT:-1G}"
        reservations:
          memory: "512m"
    networks:
      - webhook-network
    restart: unless-stopped

  # One-shot: creates every topic in KafkaTopics.java (worker/api do NOT rely on
  # broker auto-create, since that would silently apply the broker default
  # partition count instead of KAFKA_NUM_PARTITIONS). api/worker block on this
  # via `condition: service_completed_successfully` below.
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.7.0}
    container_name: webhook-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      set -e;
      for t in deliveries.dispatch deliveries.retry.1m deliveries.retry.5m deliveries.retry.15m deliveries.retry.1h deliveries.retry.6h deliveries.retry.24h deliveries.dlq incoming.forward.dispatch incoming.forward.retry incoming.forward.dlq; do
        echo \"Creating topic: $$t\";
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions ${KAFKA_NUM_PARTITIONS:-12} --replication-factor 1;
      done;
      echo 'Kafka topics ready.'"
    networks:
      - webhook-network
    restart: "no"

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: webhook-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-webhook_redis_pass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-webhook_redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: "${REDIS_MEMORY_LIMIT:-512m}"
        reservations:
          memory: "64m"
    networks:
      - webhook-network
    restart: unless-stopped

  api:
    image: ${DOCKER_REGISTRY:-ghcr.io/vadymkykalo/hookflow}-api:${API_IMAGE_TAG:-latest}
    container_name: webhook-api
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
      # docker-compose.yml never publishes 8082 (actuator is meant to be reachable
      # only from other containers on webhook-network — see the MANAGEMENT_PORT
      # comment below). This file loopback-publishes it anyway, same trust
      # boundary as the postgres/kafka/redis loopback ports above, so
      # `curl localhost:8082/actuator/health/liveness` works for a bare quick-start trial
      # without requiring `docker exec` (which docs/OPERATIONS.md's `make health`
      # uses for the build-from-source path instead).
      - "127.0.0.1:8082:8082"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-webhook_platform}
      DB_USER: ${DB_USER:-webhook_user}
      DB_PASSWORD: ${DB_PASSWORD:-webhook_pass}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_JDBC_URL: ${DB_JDBC_URL:-}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-10}
      DB_POOL_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT:-30000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SERVER_PORT: 8080
      # Actuator (incl. /actuator/prometheus) is split onto its own port so
      # Prometheus can scrape it without going through the JWT/API-key-authenticated
      # SecurityConfig filter chain on 8080. Not published to the host — only
      # reachable from other containers on webhook-network, same trust boundary
      # as postgres/kafka/redis. (Mirrors docker-compose.yml's api service.)
      MANAGEMENT_PORT: 8082
      MANAGEMENT_ADDRESS: ${MANAGEMENT_ADDRESS:-0.0.0.0}
      SCHEDULING_POOL_SIZE: ${SCHEDULING_POOL_SIZE:-8}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY must be set}
      WEBHOOK_ENCRYPTION_KEYS: ${WEBHOOK_ENCRYPTION_KEYS:-}
      WEBHOOK_ENCRYPTION_KEY_ACTIVE_VERSION: ${WEBHOOK_ENCRYPTION_KEY_ACTIVE_VERSION:-0}
      WEBHOOK_ENCRYPTION_SALT: ${WEBHOOK_ENCRYPTION_SALT:?WEBHOOK_ENCRYPTION_SALT must be set}
      WEBHOOK_MAX_PAYLOAD_SIZE_BYTES: ${WEBHOOK_MAX_PAYLOAD_SIZE_BYTES:-262144}
      WEBHOOK_MAX_FANOUT_PER_EVENT: ${WEBHOOK_MAX_FANOUT_PER_EVENT:-100}
      WEBHOOK_PAYLOAD_COMPRESSION_THRESHOLD_BYTES: ${WEBHOOK_PAYLOAD_COMPRESSION_THRESHOLD_BYTES:-1024}
      WEBHOOK_ENDPOINT_VERIFICATION_REQUIRED: ${WEBHOOK_ENDPOINT_VERIFICATION_REQUIRED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:-}
      DATA_RETENTION_OUTBOX_DAYS: ${DATA_RETENTION_OUTBOX_DAYS:-7}
      DATA_RETENTION_ATTEMPTS_DAYS: ${DATA_RETENTION_ATTEMPTS_DAYS:-90}
      DATA_RETENTION_SUCCESSFUL_ATTEMPTS_DAYS: ${DATA_RETENTION_SUCCESSFUL_ATTEMPTS_DAYS:-14}
      DATA_RETENTION_INCOMING_EVENTS_DAYS: ${DATA_RETENTION_INCOMING_EVENTS_DAYS:-30}
      DATA_RETENTION_MAX_ATTEMPTS_PER_DELIVERY: ${DATA_RETENTION_MAX_ATTEMPTS_PER_DELIVERY:-10}
      DATA_RETENTION_BATCH_SIZE: ${DATA_RETENTION_BATCH_SIZE:-1000}
      DATA_RETENTION_CRON: ${DATA_RETENTION_CRON:-0 0 2 * * *}
      DATA_RETENTION_LIMIT_CRON: ${DATA_RETENTION_LIMIT_CRON:-0 */30 * * * *}
      DATA_RETENTION_BURST_CLEANUP_CRON: ${DATA_RETENTION_BURST_CLEANUP_CRON:-0 0 */4 * * *}
      DATA_RETENTION_TABLE_METRICS_INTERVAL_MS: ${DATA_RETENTION_TABLE_METRICS_INTERVAL_MS:-900000}
      EVENT_INGESTION_RATE_LIMIT_PER_SECOND: ${EVENT_INGESTION_RATE_LIMIT_PER_SECOND:-100}
      GLOBAL_RATE_LIMIT_PER_SECOND: ${GLOBAL_RATE_LIMIT_PER_SECOND:-5000}
      GLOBAL_RATE_LIMIT_ENABLED: ${GLOBAL_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_LOGIN_PER_MINUTE: ${AUTH_RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      AUTH_RATE_LIMIT_REGISTER_PER_MINUTE: ${AUTH_RATE_LIMIT_REGISTER_PER_MINUTE:-5}
      WEBHOOK_ALLOW_PRIVATE_IPS: ${WEBHOOK_ALLOW_PRIVATE_IPS:-false}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_INGRESS_BASE_URL: ${TUNNEL_INGRESS_BASE_URL:-http://localhost:8080}
      TUNNEL_HEARTBEAT_TIMEOUT_SECONDS: ${TUNNEL_HEARTBEAT_TIMEOUT_SECONDS:-120}
      TUNNEL_CLEANUP_INTERVAL_MS: ${TUNNEL_CLEANUP_INTERVAL_MS:-60000}
      TUNNEL_REQUEST_LOG_RETENTION_DAYS: ${TUNNEL_REQUEST_LOG_RETENTION_DAYS:-7}
      WEBHOOK_INCOMING_MAX_PAYLOAD_SIZE_BYTES: ${WEBHOOK_INCOMING_MAX_PAYLOAD_SIZE_BYTES:-524288}
      WEBHOOK_TRUSTED_PROXIES: ${WEBHOOK_TRUSTED_PROXIES:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_RETRY_INTERVAL_MS: ${OUTBOX_RETRY_INTERVAL_MS:-30000}
      OUTBOX_CLEANUP_INTERVAL_MS: ${OUTBOX_CLEANUP_INTERVAL_MS:-3600000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_MAX_RETRIES: ${OUTBOX_MAX_RETRIES:-5}
      OUTBOX_DEAD_RETENTION_DAYS: ${OUTBOX_DEAD_RETENTION_DAYS:-90}
      OUTBOX_SENDING_RECOVERY_SECONDS: ${OUTBOX_SENDING_RECOVERY_SECONDS:-300}
      OUTBOX_BATCH_SEND_TIMEOUT_SECONDS: ${OUTBOX_BATCH_SEND_TIMEOUT_SECONDS:-30}
      REPLAY_BATCH_SIZE: ${REPLAY_BATCH_SIZE:-200}
      REPLAY_BATCH_DELAY_MS: ${REPLAY_BATCH_DELAY_MS:-50}
      REPLAY_MAX_EVENTS_PER_SESSION: ${REPLAY_MAX_EVENTS_PER_SESSION:-500000}
      TEST_ENDPOINT_BASE_URL: ${TEST_ENDPOINT_BASE_URL:-http://api:8080}
      TEST_ENDPOINT_MAX_PER_PROJECT: ${TEST_ENDPOINT_MAX_PER_PROJECT:-10}
      TEST_ENDPOINT_MAX_TTL_HOURS: ${TEST_ENDPOINT_MAX_TTL_HOURS:-72}
      TEST_ENDPOINT_CLEANUP_INTERVAL_MS: ${TEST_ENDPOINT_CLEANUP_INTERVAL_MS:-3600000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      APP_ENV: ${APP_ENV:-development}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-webhook_redis_pass}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      ALERTS_NOTIFICATIONS_ENABLED: ${ALERTS_NOTIFICATIONS_ENABLED:-false}
      RULES_CACHE_REFRESH_MS: ${RULES_CACHE_REFRESH_MS:-30000}
      RULES_EXECUTION_LOG_RETENTION_DAYS: ${RULES_EXECUTION_LOG_RETENTION_DAYS:-7}
      WORKFLOW_POOL_CORE_SIZE: ${WORKFLOW_POOL_CORE_SIZE:-4}
      WORKFLOW_POOL_MAX_SIZE: ${WORKFLOW_POOL_MAX_SIZE:-8}
      WORKFLOW_POOL_QUEUE_CAPACITY: ${WORKFLOW_POOL_QUEUE_CAPACITY:-50}
      WORKFLOW_MAX_DURATION_SECONDS: ${WORKFLOW_MAX_DURATION_SECONDS:-600}
      WORKFLOW_MAX_RECURSION_DEPTH: ${WORKFLOW_MAX_RECURSION_DEPTH:-3}
      WORKFLOW_STUCK_THRESHOLD_MINUTES: ${WORKFLOW_STUCK_THRESHOLD_MINUTES:-15}
      WORKFLOW_RECOVERY_INTERVAL_MS: ${WORKFLOW_RECOVERY_INTERVAL_MS:-120000}
      WORKFLOW_NODE_TIMEOUT_DEFAULT_SECONDS: ${WORKFLOW_NODE_TIMEOUT_DEFAULT_SECONDS:-30}
      WORKFLOW_NODE_TIMEOUT_HTTP_SECONDS: ${WORKFLOW_NODE_TIMEOUT_HTTP_SECONDS:-60}
      WORKFLOW_NODE_TIMEOUT_SLACK_SECONDS: ${WORKFLOW_NODE_TIMEOUT_SLACK_SECONDS:-60}
      WORKFLOW_NODE_TIMEOUT_DELAY_SECONDS: ${WORKFLOW_NODE_TIMEOUT_DELAY_SECONDS:-305}
      WORKFLOW_NODE_TIMEOUT_CREATE_EVENT_SECONDS: ${WORKFLOW_NODE_TIMEOUT_CREATE_EVENT_SECONDS:-30}
      WORKFLOW_NODE_TIMEOUT_POOL_SIZE: ${WORKFLOW_NODE_TIMEOUT_POOL_SIZE:-16}
      WORKFLOW_SHUTDOWN_AWAIT_SECONDS: ${WORKFLOW_SHUTDOWN_AWAIT_SECONDS:-30}
      WORKFLOW_TRIGGER_OUTBOX_POLL_INTERVAL_MS: ${WORKFLOW_TRIGGER_OUTBOX_POLL_INTERVAL_MS:-2000}
      WORKFLOW_TRIGGER_OUTBOX_BATCH_SIZE: ${WORKFLOW_TRIGGER_OUTBOX_BATCH_SIZE:-50}
      WORKFLOW_TRIGGER_OUTBOX_MAX_ATTEMPTS: ${WORKFLOW_TRIGGER_OUTBOX_MAX_ATTEMPTS:-3}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@hookflow.dev}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_DEFAULT_PROVIDER: ${BILLING_DEFAULT_PROVIDER:-noop}
      BILLING_RECONCILIATION_CRON: ${BILLING_RECONCILIATION_CRON:-0 0 */6 * * *}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MAP: ${STRIPE_PRICE_MAP:-}
      WAYFORPAY_MERCHANT_ACCOUNT: ${WAYFORPAY_MERCHANT_ACCOUNT:-}
      WAYFORPAY_MERCHANT_SECRET: ${WAYFORPAY_MERCHANT_SECRET:-}
      WAYFORPAY_MERCHANT_DOMAIN: ${WAYFORPAY_MERCHANT_DOMAIN:-}
      WAYFORPAY_SERVICE_URL: ${WAYFORPAY_SERVICE_URL:-}
      WAYFORPAY_PLAN_PRICES: ${WAYFORPAY_PLAN_PRICES:-}
      JAVA_EXTRA_OPTS: ${API_JAVA_OPTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # Actuator lives on MANAGEMENT_PORT (8082), not the main 8080 — see the
      # comment above. Same as docker-compose.yml's api healthcheck.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 65s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: "${API_MEMORY_LIMIT:-768m}"
        reservations:
          memory: "256m"
    networks:
      - webhook-network
    restart: unless-stopped

  worker:
    image: ${DOCKER_REGISTRY:-ghcr.io/vadymkykalo/hookflow}-worker:${WORKER_IMAGE_TAG:-latest}
    container_name: webhook-worker
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-webhook_platform}
      DB_USER: ${DB_USER:-webhook_user}
      DB_PASSWORD: ${DB_PASSWORD:-webhook_pass}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      DB_JDBC_URL: ${DB_JDBC_URL:-}
      # See docker-compose.yml's worker block -- WORKER_DB_POOL_MAX_SIZE/MIN_IDLE are
      # deliberately distinct from the API's DB_POOL_MAX_SIZE/DB_POOL_MIN_IDLE (.env.dist), or
      # a single shared .env value silently overrides both services' independently-tuned pools.
      DB_POOL_MAX_SIZE: ${WORKER_DB_POOL_MAX_SIZE:-40}
      DB_POOL_MIN_IDLE: ${WORKER_DB_POOL_MIN_IDLE:-20}
      DB_POOL_CONNECTION_TIMEOUT: ${DB_POOL_CONNECTION_TIMEOUT:-30000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SCHEDULING_POOL_SIZE: ${SCHEDULING_POOL_SIZE:-8}
      MANAGEMENT_PORT: 8081
      MANAGEMENT_ADDRESS: ${MANAGEMENT_ADDRESS:-127.0.0.1}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?WEBHOOK_ENCRYPTION_KEY must be set}
      WEBHOOK_ENCRYPTION_KEYS: ${WEBHOOK_ENCRYPTION_KEYS:-}
      WEBHOOK_ENCRYPTION_KEY_ACTIVE_VERSION: ${WEBHOOK_ENCRYPTION_KEY_ACTIVE_VERSION:-0}
      WEBHOOK_ENCRYPTION_SALT: ${WEBHOOK_ENCRYPTION_SALT:?WEBHOOK_ENCRYPTION_SALT must be set}
      WEBHOOK_ALLOW_PRIVATE_IPS: ${WEBHOOK_ALLOW_PRIVATE_IPS:-false}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_PROJECT_RATE_LIMIT_PER_SECOND: ${WEBHOOK_PROJECT_RATE_LIMIT_PER_SECOND:-50}
      WEBHOOK_OUTGOING_POOL_SIZE: ${WEBHOOK_OUTGOING_POOL_SIZE:-50}
      WEBHOOK_INCOMING_POOL_SIZE: ${WEBHOOK_INCOMING_POOL_SIZE:-20}
      WEBHOOK_ASYNC_SHUTDOWN_TIMEOUT_SECONDS: ${WEBHOOK_ASYNC_SHUTDOWN_TIMEOUT_SECONDS:-60}
      WEBHOOK_POOL_MAX_CONNECTIONS: ${WEBHOOK_POOL_MAX_CONNECTIONS:-200}
      WEBHOOK_POOL_PENDING_ACQUIRE_TIMEOUT_SECONDS: ${WEBHOOK_POOL_PENDING_ACQUIRE_TIMEOUT_SECONDS:-10}
      WEBHOOK_POOL_MAX_IDLE_TIME_SECONDS: ${WEBHOOK_POOL_MAX_IDLE_TIME_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-development}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-webhook_redis_pass}
      ORDERING_GAP_TIMEOUT_SECONDS: ${ORDERING_GAP_TIMEOUT_SECONDS:-60}
      ORDERING_DELIVERED_SEQ_TTL_HOURS: ${ORDERING_DELIVERED_SEQ_TTL_HOURS:-24}
      ORDERING_BUFFER_TTL_MINUTES: ${ORDERING_BUFFER_TTL_MINUTES:-10}
      STUCK_DELIVERY_THRESHOLD_MINUTES: ${STUCK_DELIVERY_THRESHOLD_MINUTES:-5}
      STUCK_DELIVERY_STRANDED_PENDING_THRESHOLD_MINUTES: ${STUCK_DELIVERY_STRANDED_PENDING_THRESHOLD_MINUTES:-60}
      STUCK_DELIVERY_CHECK_INTERVAL_MS: ${STUCK_DELIVERY_CHECK_INTERVAL_MS:-60000}
      STUCK_FORWARD_THRESHOLD_MINUTES: ${STUCK_FORWARD_THRESHOLD_MINUTES:-5}
      STUCK_FORWARD_CHECK_INTERVAL_MS: ${STUCK_FORWARD_CHECK_INTERVAL_MS:-60000}
      CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:-50}
      CIRCUIT_BREAKER_MINIMUM_CALLS: ${CIRCUIT_BREAKER_MINIMUM_CALLS:-5}
      CIRCUIT_BREAKER_WAIT_DURATION_SECONDS: ${CIRCUIT_BREAKER_WAIT_DURATION_SECONDS:-30}
      CIRCUIT_BREAKER_WINDOW_TTL_SECONDS: ${CIRCUIT_BREAKER_WINDOW_TTL_SECONDS:-120}
      CIRCUIT_BREAKER_SLOW_CALL_THRESHOLD_MS: ${CIRCUIT_BREAKER_SLOW_CALL_THRESHOLD_MS:-10000}
      CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD: ${CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD:-80}
      QUEUE_DEPTH_METRICS_INTERVAL_MS: ${QUEUE_DEPTH_METRICS_INTERVAL_MS:-900000}
      QUEUE_DEPTH_METRICS_RETENTION_DAYS: ${QUEUE_DEPTH_METRICS_RETENTION_DAYS:-30}
      RETRY_SCHEDULER_BATCH_SIZE: ${RETRY_SCHEDULER_BATCH_SIZE:-100}
      RETRY_SCHEDULER_MAX_PER_ENDPOINT: ${RETRY_SCHEDULER_MAX_PER_ENDPOINT:-10}
      RETRY_SCHEDULER_MAX_PER_PROJECT: ${RETRY_SCHEDULER_MAX_PER_PROJECT:-30}
      RETRY_SCHEDULER_HIGH_WATERMARK: ${RETRY_SCHEDULER_HIGH_WATERMARK:-5000}
      RETRY_SCHEDULER_SEND_TIMEOUT_SECONDS: ${RETRY_SCHEDULER_SEND_TIMEOUT_SECONDS:-30}
      RETRY_SCHEDULER_RESCHEDULE_DELAY_SECONDS: ${RETRY_SCHEDULER_RESCHEDULE_DELAY_SECONDS:-60}
      RETRY_SCHEDULER_POLL_INTERVAL_MS: ${RETRY_SCHEDULER_POLL_INTERVAL_MS:-10000}
      INCOMING_FORWARD_RETRY_POLL_INTERVAL_MS: ${INCOMING_FORWARD_RETRY_POLL_INTERVAL_MS:-10000}
      INCOMING_FORWARD_RETRY_BATCH_SIZE: ${INCOMING_FORWARD_RETRY_BATCH_SIZE:-50}
      INCOMING_FORWARD_RETRY_MAX_PER_DEST: ${INCOMING_FORWARD_RETRY_MAX_PER_DEST:-10}
      INCOMING_FORWARD_RETRY_HIGH_WATERMARK: ${INCOMING_FORWARD_RETRY_HIGH_WATERMARK:-3000}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-webhook-worker}
      KAFKA_INCOMING_GROUP_ID: ${KAFKA_INCOMING_GROUP_ID:-incoming-forward-worker}
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:-earliest}
      KAFKA_CONSUMER_MAX_RETRIES: ${KAFKA_CONSUMER_MAX_RETRIES:-3}
      KAFKA_CONSUMER_RETRY_INTERVAL_MS: ${KAFKA_CONSUMER_RETRY_INTERVAL_MS:-5000}
      KAFKA_DELIVERY_CONCURRENCY: ${KAFKA_DELIVERY_CONCURRENCY:-6}
      KAFKA_INCOMING_CONCURRENCY: ${KAFKA_INCOMING_CONCURRENCY:-3}
      WEBHOOK_MAX_CONCURRENT_PER_ENDPOINT: ${WEBHOOK_MAX_CONCURRENT_PER_ENDPOINT:-5}
      DLQ_MONITORING_INTERVAL_MS: ${DLQ_MONITORING_INTERVAL_MS:-60000}
      DLQ_MONITORING_ADMIN_CLIENT_TIMEOUT_SECONDS: ${DLQ_MONITORING_ADMIN_CLIENT_TIMEOUT_SECONDS:-10}
      DELIVERY_ESCALATION_HARD_CAP_HOURS: ${DELIVERY_ESCALATION_HARD_CAP_HOURS:-96}
      # 96, not 48: the outgoing retry ladder's worst case with full jitter is 83h and
      # RetrySchedulerService refuses to start when it does not fit inside the cap. The 48
      # here predated the ladder gaining its 24h tier and would fail every boot that did
      # not override it.
      FORWARD_ESCALATION_HARD_CAP_HOURS: ${FORWARD_ESCALATION_HARD_CAP_HOURS:-24}
      FORWARD_ESCALATION_BATCH_SIZE: ${FORWARD_ESCALATION_BATCH_SIZE:-100}
      FORWARD_ESCALATION_INTERVAL_MS: ${FORWARD_ESCALATION_INTERVAL_MS:-300000}
      DELIVERY_ESCALATION_BATCH_SIZE: ${DELIVERY_ESCALATION_BATCH_SIZE:-100}
      DELIVERY_ESCALATION_INTERVAL_MS: ${DELIVERY_ESCALATION_INTERVAL_MS:-300000}
      JAVA_EXTRA_OPTS: ${WORKER_JAVA_OPTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: "${WORKER_MEMORY_LIMIT:-768m}"
        reservations:
          memory: "256m"
    networks:
      - webhook-network
    restart: unless-stopped

  ui:
    image: ${DOCKER_REGISTRY:-ghcr.io/vadymkykalo/hookflow}-ui:${UI_IMAGE_TAG:-latest}
    container_name: webhook-ui
    ports:
      - "${UI_PORT:-5173}:5173"
    # No environment block: the UI is a static bundle behind nginx. Vite inlines
    # every VITE_* value at build time, so nothing here could change it — and on
    # a pre-built image there is no build to feed. nginx proxies /api/,
    # /ws/tunnel, /hook/ and /ingress/ to the api service, so the bundle talks
    # to its own origin and needs no API URL at all.
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: "${UI_MEMORY_LIMIT:-128m}"
        reservations:
          memory: "32m"
    networks:
      - webhook-network
    restart: unless-stopped

volumes:
  webhook_pgdata:
    name: ${POSTGRES_VOLUME_NAME:-webhook_pgdata}
  kafka_data:
  redis_data:

networks:
  webhook-network:
    driver: bridge
