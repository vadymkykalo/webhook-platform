name: Publish SDKs

# NOTE: this workflow used to fire an unconditional `npm publish` /
# `twine upload` on *every* GitHub release, including CLI-only releases that
# never touch sdks/. That fails with "version already exists" the moment an
# SDK's manifest version wasn't bumped for that release. Every publish job
# below now starts with a "Check version drift" step that compares the
# manifest version in this checkout against the version currently live on
# the registry, and skips the rest of the job (build/publish) when they
# match. Real releases still work exactly as before; no-op releases for a
# given SDK now no-op instead of failing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK to publish (node, python, php, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - node
          - python
          - php

jobs:
  publish-node:
    name: Publish Node.js SDK to npm (@hookflow/node)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' ||
      github.event.inputs.sdk == 'all' ||
      github.event.inputs.sdk == 'node'
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @hookflow/node version 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    name: Publish Python SDK to PyPI (hookflow-sdk)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' ||
      github.event.inputs.sdk == 'all' ||
      github.event.inputs.sdk == 'python'
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PUBLISHED_VERSION=$(curl -s https://pypi.org/pypi/hookflow-sdk/json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('info',{}).get('version',''))" 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: |
          pip install build twine
          pip install -e ".[dev]"

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: pytest

      - name: Build package
        if: steps.check.outputs.should_publish == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.should_publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  publish-php:
    name: Publish PHP SDK to Packagist (hookflow/php)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' ||
      github.event.inputs.sdk == 'all' ||
      github.event.inputs.sdk == 'php'
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(php -r "echo json_decode(file_get_contents('composer.json'), true)['version'] ?? '';")
          PUBLISHED_VERSION=$(curl -s https://repo.packagist.org/p2/hookflow/php.json | php -r "
            \$d = json_decode(file_get_contents('php://stdin'), true);
            \$versions = \$d['packages']['hookflow/php'] ?? [];
            echo \$versions[0]['version'] ?? '';
          ")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: vendor/bin/phpunit --no-coverage

      # Packagist auto-updates from GitHub via webhook; this just nudges it.
      # NOTE: the old webhook-platform/php package (pre-rename) was backed by
      # a separate repository and had zero real downloads/usage, so it was
      # abandoned rather than kept alive as a deprecation shim.
      - name: Trigger Packagist update
        if: steps.check.outputs.should_publish == 'true'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -n "$PACKAGIST_TOKEN" ]; then
            curl -X POST \
              -H "Content-Type: application/json" \
              "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}&autoUpdated=1" \
              -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}'
          fi
