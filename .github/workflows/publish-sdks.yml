name: Publish SDKs

# NOTE: this workflow used to fire an unconditional `npm publish` /
# `twine upload` on *every* GitHub release, including CLI-only releases that
# never touch sdks/. That fails with "version already exists" the moment an
# SDK's manifest version wasn't bumped for that release. Every publish job
# below now starts with a "Check version drift" step that compares the
# manifest version in this checkout against the version currently live on
# the registry, and skips the rest of the job (build/publish) when they
# match. Real releases still work exactly as before; no-op releases for a
# given SDK now no-op instead of failing.

# NOTE 2: `on: release: [published]` is deliberately NOT used, and must not be
# added back. The v2.3.0 and v2.4.0 releases are created by release-cli.yml via
# action-gh-release, which runs as github-actions[bot] with the default
# GITHUB_TOKEN — and GitHub does not start a workflow from an event raised by
# that token, to stop workflows triggering themselves. So the release event
# never arrived and the SDKs sat at 2.2.1 through two releases with nothing
# failing anywhere. release-cli.yml now calls this workflow directly instead:
# an explicit call cannot be silently dropped the way an event can.
on:
  workflow_call:
    inputs:
      sdk:
        description: 'SDK to publish (node, python, php, all)'
        required: false
        default: 'all'
        type: string
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK to publish (node, python, php, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - node
          - python
          - php

# Least privilege by default. `id-token: write` is granted per-job below, only
# where a registry's OIDC (Trusted Publishing) flow needs it.
permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Node.js SDK to npm (@webhook-platform/node)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing + --provenance
    if: >
      inputs.sdk == 'all' ||
      inputs.sdk == 'node'
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: `npm@latest` (needed for Trusted Publishing) requires
          # ^20.17 || >=22.9, and which 20.x the runner image carries is not
          # something to depend on.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @webhook-platform/node version 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      # npm >= 11.5.1 is what understands Trusted Publishing; setup-node pins an
      # older npm with Node 20.
      - name: Upgrade npm for Trusted Publishing
        if: steps.check.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      # v2.5.0 and v2.6.0 both failed here with
      #   npm error 404 Not Found - PUT .../@webhook-platform%2fnode
      # which is what npm returns for an unauthenticated scoped publish: the
      # long-lived NPM_TOKEN had expired, and npm was left two releases behind
      # at 2.2.1. OIDC removes the standing secret so that cannot recur, and
      # --provenance attaches the sigstore attestation the container images
      # already carry.
      #
      # One-time setup on npmjs.com, which no workflow can do for you: package
      # settings -> Trusted Publisher -> this repository, workflow
      # `publish-sdks.yml`. NPM_TOKEN stays here as the fallback npm uses when
      # no trusted publisher is configured; once OIDC works it can be deleted.
      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    name: Publish Python SDK to PyPI (webhook-platform)
    runs-on: ubuntu-latest
    if: >
      inputs.sdk == 'all' ||
      inputs.sdk == 'python'
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PUBLISHED_VERSION=$(curl -s https://pypi.org/pypi/webhook-platform/json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('info',{}).get('version',''))" 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: |
          pip install build twine
          pip install -e ".[dev]"

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: pytest

      - name: Build package
        if: steps.check.outputs.should_publish == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.should_publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

  publish-php:
    name: Publish PHP SDK to Packagist (webhook-platform/php)
    runs-on: ubuntu-latest
    if: >
      inputs.sdk == 'all' ||
      inputs.sdk == 'php'
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check version drift
        id: check
        run: |
          LOCAL_VERSION=$(php -r "echo json_decode(file_get_contents('composer.json'), true)['version'] ?? '';")
          PUBLISHED_VERSION=$(curl -s https://repo.packagist.org/p2/webhook-platform/php.json | php -r "
            \$d = json_decode(file_get_contents('php://stdin'), true);
            \$versions = \$d['packages']['webhook-platform/php'] ?? [];
            echo \$versions[0]['version'] ?? '';
          ")
          echo "local=$LOCAL_VERSION published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: vendor/bin/phpunit --no-coverage

      # This step used to `curl ... || true` inside an `if [ -n "$PACKAGIST_TOKEN" ]`
      # and report success either way. It reported success for every release from
      # v2.3.0 on while Packagist stayed on 2.2.1, because the package there is
      # registered against a *different* repository (vadymkykalo/webhook-platform-php)
      # and an update-package call naming this monorepo matches nothing. A publish
      # step that cannot fail is not a publish step, so this one now checks both
      # the secret and the API's answer.
      #
      # One-time setup on packagist.org, which no workflow can do for you: point
      # the `webhook-platform/php` package at this repository (or split sdks/php
      # out to a repository of its own and tag it). Until that is done this step
      # fails loudly, which is the intended behaviour — silence is what let the
      # SDK sit six months behind.
      - name: Trigger Packagist update
        if: steps.check.outputs.should_publish == 'true'
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PACKAGIST_TOKEN:-}" ] || [ -z "${PACKAGIST_USERNAME:-}" ]; then
            echo "::error::PACKAGIST_USERNAME / PACKAGIST_TOKEN are not set, so the PHP SDK cannot be published."
            exit 1
          fi

          RESPONSE=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}&autoUpdated=1" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}')

          echo "Packagist responded: $RESPONSE"

          if ! echo "$RESPONSE" | grep -q '"status" *: *"success"'; then
            echo "::error::Packagist did not accept the update. The package is most likely registered against a different repository — see the comment above this step."
            exit 1
          fi
