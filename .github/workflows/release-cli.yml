name: Release CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  release-cli:
    name: Build & Publish CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build CLI JAR
        run: mvn clean package -pl webhook-platform-cli -am -DskipTests -B

      - name: Prepare release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp webhook-platform-cli/target/webhook-platform-cli-*.jar hookflow-cli.jar
          # install.sh refuses to run a JAR that doesn't match this file (see
          # verify_checksum() in webhook-platform-cli/install.sh) — table
          # stakes for a curl-pipe installer.
          sha256sum hookflow-cli.jar > SHA256SUMS
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Hookflow ${{ github.ref_name }}"
          body: |
            ## Hookflow CLI ${{ env.VERSION }}

            ### Install
            ```bash
            curl -fsSL https://raw.githubusercontent.com/vadymkykalo/webhook-platform/main/webhook-platform-cli/install.sh | bash
            ```

            Or download `hookflow-cli.jar` and run:
            ```bash
            java -jar hookflow-cli.jar --help
            ```

            ### Requirements
            - Java 17+ (auto-installed by the install script)

            ### Verify

            ```bash
            sha256sum -c SHA256SUMS
            ```
          files: |
            hookflow-cli.jar
            SHA256SUMS
          draft: false
          prerelease: false

  # The release above is created by github-actions[bot] with the default
  # GITHUB_TOKEN, and GitHub will not start a workflow from an event that token
  # raised. publish-sdks.yml used to listen for `release: published` and so
  # never ran for v2.3.0 or v2.4.0 — the SDKs stayed at 2.2.1 through two
  # releases with nothing failing anywhere to say so. Calling it explicitly
  # cannot be dropped that way, and it fails loudly if it does fail.
  publish-sdks:
    name: Publish SDKs
    needs: release-cli
    uses: ./.github/workflows/publish-sdks.yml
    with:
      sdk: all
    secrets: inherit
