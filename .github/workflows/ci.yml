name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Version drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No SNAPSHOT-suffix skip here: pom.xml is intentionally allowed to run a
    # -SNAPSHOT ahead of the Chart/UI/SDK versions between releases (see
    # scripts/check-version-drift.sh) but every real value still has to agree.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check pom / Chart / UI / SDK versions agree
        run: scripts/check-version-drift.sh

  backend-build:
    name: Backend Build & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Compile all modules
        run: mvn clean compile -B
        
      - name: Package artifacts
        run: mvn package -DskipTests -B

      - name: Upload CLI JAR
        uses: actions/upload-artifact@v4
        with:
          name: hookflow-cli
          path: webhook-platform-cli/target/webhook-platform-cli-*.jar
          retention-days: 30

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      # This and the integration job below are separate GitHub Actions
      # jobs on separate runners with no shared filesystem, so each writes
      # its own distinctly-named exec file (jacoco-unit.exec here,
      # jacoco-it.exec in the integration job) rather than the plugin's
      # default target/jacoco.exec - a naive setup where both jobs wrote the
      # same filename and only one got published/read downstream would
      # silently report only whichever run happened to be looked at, not the
      # true merged coverage. The coverage-report job later downloads both
      # sets of exec files into one checkout and runs jacoco:report-aggregate,
      # whose default file pattern (**/jacoco*.exec) picks up both.
      # Cheap guard before the tests themselves: the unit/integration split is done
      # by class-name suffix alone, so a Testcontainers test with a plain *Test name
      # lands here, where there is no Docker, and fails as if it were broken.
      - name: Check test routing
        run: scripts/check-test-routing.sh

      - name: Run unit tests
        run: mvn test -B -Dtest='!*IntegrationTest,!*IT,!*RepositoryTest,!*ConcurrencyTest,!*RbacTest,!*IsolationTest' -Djacoco.destFile=target/jacoco-unit.exec --fail-at-end

      - name: Test Summary
        if: always()
        run: |
          echo "### Backend Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Unit tests completed. See workflow logs for details." >> $GITHUB_STEP_SUMMARY

      # Uploaded even on failure (--fail-at-end above means a failing class
      # doesn't stop the rest of the module's tests from running and
      # recording coverage) so the aggregate job can still build the fullest
      # picture available.
      - name: Upload unit test coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit-exec
          path: webhook-platform-*/target/jacoco-unit.exec
          retention-days: 7
          if-no-files-found: warn

  backend-integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: backend-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run integration tests with Testcontainers
        # surefire 3.x split the old failIfNoTests flag in two - failIfNoTests
        # still covers "this whole run found zero tests", but a -Dtest=pattern that
        # matches zero classes in a given module (e.g. common/cli, which have no
        # *RepositoryTest/*IntegrationTest/etc classes) now needs
        # surefire.failIfNoSpecifiedTests=false too, or the reactor build fails there
        # before ever reaching api/worker.
        run: mvn test -B -Dtest='*RepositoryTest,*IntegrationTest,*IT,*ConcurrencyTest,*RbacTest,*IsolationTest' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.destFile=target/jacoco-it.exec --fail-at-end
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          DOCKER_API_VERSION: "1.44"

      - name: Integration Test Summary
        if: always()
        run: |
          echo "### Backend Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Integration tests with Testcontainers completed." >> $GITHUB_STEP_SUMMARY
          echo "- PostgreSQL: Testcontainers" >> $GITHUB_STEP_SUMMARY

      # See the matching comment in the unit-test job above - distinct
      # filename, uploaded so coverage-report can merge this with the unit
      # job's exec data into one real aggregate.
      - name: Upload integration test coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-integration-exec
          path: webhook-platform-*/target/jacoco-it.exec
          retention-days: 7
          if-no-files-found: warn

  # The actual point of splitting exec-data upload above - neither
  # backend-test nor backend-integration-test alone has the full picture
  # (each only ran half the test classes), and they run on separate runners
  # with no shared filesystem, so "coverage" can't just be read out of
  # either job directly. This job collects both artifacts into one checkout,
  # recompiles (tests skipped - only the just-downloaded exec data is used
  # for coverage, not a fresh run) so class files exist for JaCoCo to map
  # execution data onto, then runs `mvn verify` so both
  # jacoco:report-aggregate (webhook-platform-coverage-report/pom.xml) and
  # each real module's own jacoco:merge + jacoco:check (root pom.xml +
  # common/api/worker/cli's own pom.xml) fire against the true merged
  # unit+integration coverage.
  #
  # `if: ${{ !cancelled() }}` (not the default "needs both to succeed") so a
  # real coverage number - even partial - is still visible on the PR when
  # one suite has unrelated failures; --fail-at-end in both test jobs above
  # means a failing class doesn't stop its module's other tests from running
  # and recording coverage either.
  coverage-report:
    name: Aggregate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test, backend-integration-test]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download unit test coverage data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-unit-exec
        continue-on-error: true

      - name: Download integration test coverage data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-integration-exec
        continue-on-error: true

      # -DskipTests: tests are not re-run here - class files are needed only
      # so JaCoCo can map the exec data just downloaded onto real bytecode
      # and source. Needs `verify`, not `test`: report-aggregate (in
      # webhook-platform-coverage-report/pom.xml) is bound to `test`, but the
      # per-module jacoco-merge (root pom.xml) and jacoco:check executions
      # (each of common/api/worker/cli's own pom.xml) are bound to `verify` -
      # deliberately later than `test`, so CI's two split `mvn test`
      # invocations elsewhere in this file (unit-only / integration-only
      # filters) never trip a threshold check against partial data. This is
      # the one place in the whole pipeline that reaches `verify`, so it's
      # the only place those merge+check executions run for real.
      - name: Compile modules, aggregate report, threshold check
        run: mvn verify -B -pl webhook-platform-coverage-report -am -DskipTests

      - name: Coverage Summary
        if: always()
        run: |
          echo "### Coverage Report (unit + integration merged)" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco-aggregate/index.html ]; then
            echo "Aggregate report generated - see the jacoco-aggregate-report artifact." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::No aggregate report was produced - check the exec-data download steps above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload aggregate coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-aggregate-report
          path: target/site/jacoco-aggregate
          retention-days: 30
          if-no-files-found: warn

  # Proves backups are actually restorable, not just "a CronJob ran".
  # backup -> destroy the data -> restore -> assert it's back. An untested
  # restore path is the most common cause of an unusable backup.
  restore-drill:
    name: Backup/Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from .env.dist
        run: cp .env.dist .env

      - name: Start embedded Postgres
        run: docker compose --profile embedded-db up -d postgres

      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec webhook-postgres pg_isready -U webhook_user -d webhook_platform; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres never became ready"
          exit 1

      - name: Seed test data (simulates "ingest some events")
        run: |
          docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c \
            "CREATE TABLE restore_drill_test (id serial primary key, note text);"
          docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c \
            "INSERT INTO restore_drill_test (note) VALUES ('event-1'), ('event-2'), ('event-3');"

      - name: Backup (make backup-db)
        run: make backup-db

      - name: Destroy the data
        run: docker exec webhook-postgres psql -U webhook_user -d webhook_platform -c "DROP TABLE restore_drill_test;"

      - name: Restore (make restore-db)
        run: |
          FILE=$(ls -t backups/webhook_platform_*.dump | head -1)
          echo "Restoring from $FILE"
          make restore-db FILE="$FILE" CONFIRM=YES

      - name: Assert data integrity
        run: |
          COUNT=$(docker exec webhook-postgres psql -U webhook_user -d webhook_platform -tAc "SELECT count(*) FROM restore_drill_test;")
          echo "Row count after restore: $COUNT"
          if [ "$COUNT" != "3" ]; then
            echo "::error::Restore drill FAILED — expected 3 rows after restore, got $COUNT"
            exit 1
          fi
          NOTES=$(docker exec webhook-postgres psql -U webhook_user -d webhook_platform -tAc "SELECT string_agg(note, ',' ORDER BY id) FROM restore_drill_test;")
          if [ "$NOTES" != "event-1,event-2,event-3" ]; then
            echo "::error::Restore drill FAILED — row content mismatch: $NOTES"
            exit 1
          fi

      - name: Restore Drill Summary
        if: always()
        run: |
          echo "### Backup/Restore Drill Results" >> $GITHUB_STEP_SUMMARY
          echo "backup -> destroy -> restore -> assert data integrity: PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: docker compose --profile embedded-db down -v

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webhook-platform-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: webhook-platform-ui
        run: npm ci
      
      # openapi.yaml is drift-checked against springdoc by OpenApiDriftIntegrationTest,
      # so it describes the real backend. This carries that guarantee across to the
      # frontend: api.generated.ts is committed, and a DTO change that never reached
      # it fails here instead of surfacing as a runtime `undefined` in the browser.
      # The typecheck step below is the other half — src/types/api.contract.ts asserts
      # the hand-written mirror the app imports still matches these schemas.
      #
      # A step in this job rather than a job of its own: `main` requires a fixed list
      # of status checks, and a new job would have to be added to that list before it
      # could gate anything.
      - name: Check generated API types match openapi.yaml
        run: scripts/check-types-drift.sh

      # The in-app API reference is rendered from a derived index generated from
      # the same openapi.yaml, and that index is committed. Before this, the
      # reference was 2,100 lines of hand-written endpoint tables that nothing
      # kept in sync — this is what stops the replacement rotting the same way.
      - name: Check generated docs API index matches openapi.yaml
        working-directory: webhook-platform-ui
        run: npm run docs:api-index:check

      - name: Run ESLint
        working-directory: webhook-platform-ui
        run: npm run lint
      
      - name: Run TypeScript typecheck
        working-directory: webhook-platform-ui
        run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webhook-platform-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: webhook-platform-ui
        run: npm ci
      
      # test:coverage (vitest run --coverage) subsumes test:ci - it
      # still runs every test, plus instruments and enforces the thresholds
      # in vite.config.ts. Using it here (rather than a separate coverage
      # step) means the coverage gate is the same command a PR's CI actually
      # ran, not a second, easier-to-drift-from invocation.
      - name: Run tests with coverage
        working-directory: webhook-platform-ui
        run: npm run test:coverage

      - name: Test Summary
        if: always()
        run: |
          echo "### Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Vitest tests + coverage thresholds completed. See workflow logs for details." >> $GITHUB_STEP_SUMMARY

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-report
          path: webhook-platform-ui/coverage
          retention-days: 30
          if-no-files-found: warn

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-lint, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webhook-platform-ui/package-lock.json
      
      - name: Install dependencies
        working-directory: webhook-platform-ui
        run: npm ci
      
      - name: Build production bundle
        working-directory: webhook-platform-ui
        run: npm run build
      
      - name: Build Summary
        if: always()
        run: |
          echo "### Frontend Build Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ ESLint passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ TypeScript typecheck passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Production build successful" >> $GITHUB_STEP_SUMMARY

  security-sast:
    name: SAST (SpotBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      # SpotBugs stays advisory (continue-on-error) DELIBERATELY, not by oversight:
      # the existing findings across all modules have not been triaged yet, so
      # flipping this to gating today would block every PR on pre-existing debt
      # instead of new regressions. Triage is tracked separately; once the
      # backlog is clear (or suppressed with justification, like the OWASP
      # suppression file below), remove `continue-on-error` here so new SpotBugs
      # findings fail the build the same way Trivy/OWASP now do.
      - name: Run SpotBugs analysis
        run: mvn compile com.github.spotbugs:spotbugs-maven-plugin:4.8.3.1:check -B -DskipTests
        continue-on-error: true

      - name: SAST Summary
        if: always()
        run: |
          echo "### SAST (SpotBugs) Results" >> $GITHUB_STEP_SUMMARY
          echo "Static analysis completed. Check workflow logs for findings." >> $GITHUB_STEP_SUMMARY
          echo "_Advisory only — see comment in ci.yml for why this doesn't gate yet._" >> $GITHUB_STEP_SUMMARY

  # OWASP Dependency-Check (SCA) is not here: it lives in
  # .github/workflows/security-sca.yml, on a nightly schedule plus release/hotfix
  # branches. It cost 6-104 minutes per run depending on NVD cache state and its
  # input (the NVD feed) does not change with the diff. Pull requests keep
  # dependency-CVE coverage through `container-scan` below, which scans the same
  # Maven artifacts inside the built images. See that workflow's header comment.

  docker-build:
    name: Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, backend-integration-test, frontend-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # The only full builds in the workflow. docker-compose-smoke and
      # container-scan need the same three images and used to rebuild each from
      # scratch — nine full builds per run for three distinct images. They now
      # restore from the layer cache written here (scoped per image so the three
      # do not evict one another), which is why both declare needs: docker-build.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webhook-platform-api/Dockerfile
          tags: webhook-platform-api:test
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      
      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webhook-platform-worker/Dockerfile
          tags: webhook-platform-worker:test
          load: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      
      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webhook-platform-ui/Dockerfile
          tags: webhook-platform-ui:test
          load: false
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
      
      - name: Docker Build Summary
        if: always()
        run: |
          echo "### Docker Build Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ All images built successfully" >> $GITHUB_STEP_SUMMARY

  # Proves docker-compose.pull.yml (the no-Maven/no-npm quick start
  # advertised in the README) actually boots and answers health checks, so it
  # can't silently rot the way the old build-only compose flow did. Rebuilds
  # the three images itself (same pattern as container-scan below) and tags
  # them to match what docker-compose.pull.yml resolves to when DOCKER_REGISTRY
  # is pointed at the local :test images instead of GHCR — no registry
  # credentials needed to run this.
  docker-compose-smoke:
    name: Docker Compose Pull-Path Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webhook-platform-api/Dockerfile
          tags: webhook-platform-api:test
          load: true
          cache-from: type=gha,scope=api

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webhook-platform-worker/Dockerfile
          tags: webhook-platform-worker:test
          load: true
          cache-from: type=gha,scope=worker

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webhook-platform-ui/Dockerfile
          tags: webhook-platform-ui:test
          load: true
          cache-from: type=gha,scope=ui

      - name: Create .env from .env.dist
        run: cp .env.dist .env

      - name: Start pull-based compose stack (using the images just built)
        env:
          DOCKER_REGISTRY: webhook-platform
          API_IMAGE_TAG: test
          WORKER_IMAGE_TAG: test
          UI_IMAGE_TAG: test
        run: docker compose -f docker-compose.pull.yml --env-file .env up -d

      - name: Wait for API and UI health, then curl both endpoints
        run: |
          # Actuator (health/prometheus) lives on its own port (8082, loopback-only
          # in docker-compose.pull.yml) rather than the main API port (8080), so it
          # bypasses the JWT/API-key-authenticated security chain — see the
          # MANAGEMENT_PORT comment in docker-compose.pull.yml. Using /liveness
          # rather than the aggregate /actuator/health: the latter folds in the
          # Spring Boot mail health indicator, which reads DOWN (503) whenever no
          # SMTP server is reachable — true by default in this stack even with
          # EMAIL_ENABLED=false — so it's not a reliable up/down signal here.
          for i in $(seq 1 60); do
            api_ok=$(curl -sf -o /dev/null http://localhost:8082/actuator/health/liveness && echo 1 || echo 0)
            ui_ok=$(curl -sf -o /dev/null http://localhost:5173 && echo 1 || echo 0)
            if [ "$api_ok" = "1" ] && [ "$ui_ok" = "1" ]; then
              echo "API and UI both healthy after ${i}0s"
              break
            fi
            sleep 10
            if [ "$i" = "60" ]; then
              echo "::error::Stack did not become healthy in time"
              docker compose -f docker-compose.pull.yml ps
              docker compose -f docker-compose.pull.yml logs
              exit 1
            fi
          done
          echo "--- curl http://localhost:8082/actuator/health/liveness ---"
          curl -f http://localhost:8082/actuator/health/liveness
          echo ""
          echo "--- curl http://localhost:5173 (status only) ---"
          curl -f -o /dev/null -w 'HTTP %{http_code}\n' http://localhost:5173

      - name: Smoke Test Summary
        if: always()
        run: |
          echo "### Docker Compose Pull-Path Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose.pull.yml booted and both /actuator/health/liveness (API) and / (UI) responded." >> $GITHUB_STEP_SUMMARY

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.pull.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.pull.yml down -v

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build API image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webhook-platform-api/Dockerfile
          tags: webhook-platform-api:test
          load: true
          cache-from: type=gha,scope=api
      
      - name: Build Worker image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webhook-platform-worker/Dockerfile
          tags: webhook-platform-worker:test
          load: true
          cache-from: type=gha,scope=worker
      
      - name: Build UI image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webhook-platform-ui/Dockerfile
          tags: webhook-platform-ui:test
          load: true
          cache-from: type=gha,scope=ui
      
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version
      
      - name: Download Trivy DBs
        run: |
          trivy image --download-db-only --db-repository public.ecr.aws/aquasecurity/trivy-db:2
          trivy image --download-java-db-only --java-db-repository public.ecr.aws/aquasecurity/trivy-java-db:1
      
      # Staged rollout: gate on CRITICAL now (exit-code 1, build goes red), keep
      # HIGH informational (exit-code 0) until the CRITICAL backlog is triaged.
      # Widen to HIGH by dropping `--severity CRITICAL --exit-code 1` for the
      # advisory step below and deleting the gating step once ready.
      - name: Run Trivy on API image (CRITICAL - gating)
        run: trivy image --format table --severity CRITICAL --exit-code 1 --skip-db-update --skip-java-db-update webhook-platform-api:test

      - name: Run Trivy on API image (HIGH - informational)
        if: always()
        run: trivy image --format table --severity HIGH --exit-code 0 --skip-db-update --skip-java-db-update webhook-platform-api:test

      - name: Run Trivy on Worker image (CRITICAL - gating)
        if: always()
        run: trivy image --format table --severity CRITICAL --exit-code 1 --skip-db-update --skip-java-db-update webhook-platform-worker:test

      - name: Run Trivy on Worker image (HIGH - informational)
        if: always()
        run: trivy image --format table --severity HIGH --exit-code 0 --skip-db-update --skip-java-db-update webhook-platform-worker:test

      - name: Run Trivy on UI image (CRITICAL - gating)
        if: always()
        run: trivy image --format table --severity CRITICAL --exit-code 1 --skip-db-update --skip-java-db-update webhook-platform-ui:test

      - name: Run Trivy on UI image (HIGH - informational)
        if: always()
        run: trivy image --format table --severity HIGH --exit-code 0 --skip-db-update --skip-java-db-update webhook-platform-ui:test

      - name: Container Scan Summary
        if: always()
        run: |
          echo "### Container Scan (Trivy) Results" >> $GITHUB_STEP_SUMMARY
          echo "Container vulnerability scan completed for all images." >> $GITHUB_STEP_SUMMARY
          echo "CRITICAL findings fail the build; HIGH is informational during the staged rollout." >> $GITHUB_STEP_SUMMARY
