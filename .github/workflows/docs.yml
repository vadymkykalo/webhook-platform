name: Docs Site

# Publishes the committed OpenAPI spec (openapi.yaml, kept current by
# the drift check in ci.yml's docker-compose-smoke job) as a browsable,
# linkable API reference via GitHub Pages. Rebuilds on every push to `main`
# (i.e. every release) and on manual dispatch - not on `develop`, so the
# public docs site always reflects what's actually shipped.
#
# One-time setup this workflow cannot do for you: Settings -> Pages -> Source
# = "GitHub Actions" on this repository. Until that's set, this workflow will
# build successfully but the deploy-pages step has nothing to publish to.

on:
  push:
    branches:
      - main
    paths:
      - 'openapi.yaml'
      - 'docs/api-reference.html'
      - 'docs/img.png'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/api-reference.html _site/index.html
          cp openapi.yaml _site/openapi.yaml
          # Redoc reads spec-url relative to the HTML file; index.html and
          # openapi.yaml sit side by side in _site/, so "../openapi.yaml" in
          # the committed docs/api-reference.html would resolve wrong here -
          # rewrite it to a same-directory reference for the published copy.
          sed -i 's#spec-url="\.\./openapi\.yaml"#spec-url="openapi.yaml"#' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
