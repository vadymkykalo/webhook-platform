# Dependabot version-update configuration.
#
# Six ecosystems: root Maven build, the UI app, the three published SDKs
# (Node/npm, Python/pip, PHP/composer), and the GitHub Actions used in
# .github/workflows/.
#
# Patch AND minor updates are grouped into one PR per ecosystem; only majors
# land individually, since those are the ones that actually need a look. This
# was previously patch-only grouping with a limit of 10 per ecosystem, which
# meant a refresh could open ~30 PRs at once — each dragging a full CI run
# including the then-per-push OWASP scan that took up to 104 minutes. That is
# what led to this file being renamed to .paused rather than tuned.
#
# The scan has since moved to .github/workflows/security-sca.yml (nightly plus
# release/hotfix), so a Dependabot PR now costs a normal CI run. The limit is
# still lowered to 5 per ecosystem: grouped minors mean far fewer PRs are needed
# to carry the same updates, and a smaller cap keeps a bad week from flooding
# the queue again.
version: 2
updates:
  # --- Maven (root multi-module build: common, api, worker, cli) ---
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      maven-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "maven"

  # --- npm: dashboard UI ---
  - package-ecosystem: "npm"
    directory: "/webhook-platform-ui"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ui-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "npm"
      - "ui"

  # --- npm: Node SDK ---
  - package-ecosystem: "npm"
    directory: "/sdks/node"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      node-sdk-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "npm"
      - "sdk"

  # --- pip: Python SDK ---
  - package-ecosystem: "pip"
    directory: "/sdks/python"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-sdk-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "pip"
      - "sdk"

  # --- composer: PHP SDK ---
  - package-ecosystem: "composer"
    directory: "/sdks/php"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      php-sdk-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "composer"
      - "sdk"

  # --- github-actions: workflow action versions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-patch:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
      - "github-actions"
