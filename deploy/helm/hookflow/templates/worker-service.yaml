apiVersion: v1
kind: Service
metadata:
  name: {{ include "hookflow.fullname" . }}-worker
  labels:
    {{- include "hookflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    # Actuator only — the worker consumes from Kafka and serves no API. The
    # ServiceMonitor scrapes this port by name.
    - port: {{ include "hookflow.worker.managementPort" . }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "hookflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
