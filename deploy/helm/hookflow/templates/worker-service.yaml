apiVersion: v1
kind: Service
metadata:
  name: {{ include "hookflow.fullname" . }}-worker
  labels:
    {{- include "hookflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hookflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
