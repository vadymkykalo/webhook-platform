apiVersion: v1
kind: Service
metadata:
  name: {{ include "hookflow.fullname" . }}-api
  labels:
    {{- include "hookflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    # Actuator. Unauthenticated by design (that is the point of splitting it
    # off 8080), so it stays a ClusterIP port — the same trust boundary
    # docker-compose.yml gives it by not publishing 8082 to the host. The
    # ServiceMonitor scrapes this port by name; nothing outside the cluster
    # reaches it unless an Ingress is pointed here, which nothing in this chart
    # does.
    - port: {{ include "hookflow.api.managementPort" . }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "hookflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
