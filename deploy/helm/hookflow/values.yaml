# Default values for Hookflow self-hosted deployment
# This is a YAML-formatted file.

global:
  imageRegistry: ""
  imagePullSecrets: []

# API service configuration
api:
  replicaCount: 2
  image:
    # Published by .github/workflows/docker-publish.yml on every version tag
    # (multi-arch: linux/amd64, linux/arm64).
    repository: ghcr.io/vadymkykalo/hookflow-api
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  env:
    APP_ENV: production
    LOG_LEVEL: INFO
    WEBHOOK_ALLOW_PRIVATE_IPS: "false"
    SWAGGER_ENABLED: "false"
    DB_POOL_MAX_SIZE: "20"
    DB_POOL_MIN_IDLE: "15"
  
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  
  pdb:
    enabled: false
    minAvailable: 1

# Worker service configuration
worker:
  replicaCount: 2
  image:
    # Published by .github/workflows/docker-publish.yml on every version tag
    # (multi-arch: linux/amd64, linux/arm64).
    repository: ghcr.io/vadymkykalo/hookflow-worker
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1536Mi
  
  env:
    APP_ENV: production
    LOG_LEVEL: INFO
    KAFKA_DELIVERY_CONCURRENCY: "8"
    DB_POOL_MAX_SIZE: "30"
    DB_POOL_MIN_IDLE: "20"
  
  livenessProbe:
    httpGet:
      path: /actuator/health/liveness
      port: 8081
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /actuator/health/readiness
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
  
  pdb:
    enabled: false
    minAvailable: 1

# UI service configuration
ui:
  replicaCount: 2
  image:
    # Published by .github/workflows/docker-publish.yml on every version tag
    # (multi-arch: linux/amd64, linux/arm64).
    repository: ghcr.io/vadymkykalo/hookflow-ui
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    hosts:
      - host: app.hookflow.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: hookflow-ui-tls
        hosts:
          - app.hookflow.dev

# PostgreSQL configuration
# P1-19: this chart no longer ships a PostgreSQL subchart (was Bitnami,
# removed - see Chart.yaml). `enabled` now only selects which host/port
# templates.tpl reads (see hookflow.postgresql.* in templates/_helpers.tpl);
# it does not deploy a database. Point `external` at your own instance -
# managed (RDS/Cloud SQL/etc.) for production, or your own StatefulSet/
# Docker container (postgres:16-alpine is what docker-compose.yml and CI
# test against) for a self-managed cluster.
postgresql:
  enabled: false
  # auth.* is read by templates/db-backup-cronjob.yaml as the primary
  # source for the backup job's DB name/user/secret (falling back to
  # external.* below) - kept even with the subchart gone.
  auth:
    username: webhook_user
    password: ""  # Use existingSecret instead
    database: hookflow
    existingSecret: hookflow-postgresql-secret

  # Bring-your-own PostgreSQL configuration (required - see the note above).
  external:
    host: ""  # e.g., postgres.example.com
    port: 5432
    database: hookflow
    username: webhook_user
    existingSecret: hookflow-postgresql-secret
    existingSecretPasswordKey: password

# Kafka configuration
# P1-19: this chart no longer ships a Kafka subchart (was Bitnami, removed -
# see Chart.yaml; Bitnami had already dropped Kafka from its free catalog
# entirely). Point `external` at your own cluster - managed (MSK/Confluent
# Cloud/etc.) for production, or your own StatefulSet/Docker container
# (apache/kafka:3.7.0 is what docker-compose.yml and CI test against, and is
# also the image templates/kafka-topics-job.yaml itself uses to create
# topics) for a self-managed cluster.
kafka:
  enabled: false
  # Topic configuration - read by templates/kafka-topics-job.yaml regardless
  # of `enabled`.
  topicPartitions: 12  # Number of partitions for delivery topics
  topicReplicationFactor: 1  # Set to 3 for production multi-broker clusters

  # Bring-your-own Kafka configuration (required - see the note above).
  external:
    bootstrapServers: ""  # e.g., kafka-1:9092,kafka-2:9092,kafka-3:9092

# Redis configuration
# P1-19: this chart no longer ships a Redis subchart (was Bitnami, removed -
# see Chart.yaml) - `enabled` therefore now defaults to false (it defaulted
# to true when a subchart still backed it). Point `external` at your own
# instance - managed (ElastiCache/Memorystore/etc.) for production, or your
# own StatefulSet/Docker container (redis:7-alpine is what
# docker-compose.yml and CI test against) for a self-managed cluster.
redis:
  enabled: false
  # auth.existingSecret* is read wherever Redis credentials are needed
  # regardless of `enabled` - kept even with the subchart gone.
  auth:
    enabled: true
    existingSecret: hookflow-redis-secret
    existingSecretPasswordKey: password

  # Bring-your-own Redis configuration (required - see the note above).
  external:
    host: ""  # e.g., redis.example.com
    port: 6379
    existingSecret: hookflow-redis-secret
    existingSecretPasswordKey: password

# Database backup configuration
backup:
  enabled: false  # Enable to create a CronJob for PostgreSQL backups
  schedule: "0 2 * * *"  # Daily at 2 AM UTC
  image: postgres:16-alpine
  retainCount: 7  # Keep last N backup files
  storageSize: 10Gi
  storageClass: ""  # Use default StorageClass if empty
  existingClaim: ""  # Use existing PVC instead of creating one
  activeDeadlineSeconds: 3600  # Max 1 hour for backup job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Secrets configuration
secrets:
  # Encryption key for webhook secrets (32 characters)
  encryptionKey:
    existingSecret: hookflow-secrets
    key: encryption-key
  
  # JWT secret for authentication
  jwtSecret:
    existingSecret: hookflow-secrets
    key: jwt-secret

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Network Policy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Monitoring (Prometheus Operator + Grafana)
monitoring:
  serviceMonitor:
    enabled: false  # Enable if using kube-prometheus-stack
    interval: 15s
    scrapeTimeout: 10s
    labels: {}  # e.g., release: prometheus
  prometheusRule:
    enabled: false  # Enable to deploy alert rules as PrometheusRule CRD
    labels: {}  # e.g., release: prometheus
  grafanaDashboards:
    enabled: false  # Enable to create ConfigMap with Grafana dashboards
    labels: {}  # e.g., grafana_dashboard: "1"

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
