# Hookflow — Prometheus Alert Rules
# Deploy alongside Prometheus via configmap or PrometheusRule CRD.
#
# Metrics sources:
#   - delivery_queue_depth{status=pending|processing|dlq}     (QueueDepthMetricsExporter)
#   - incoming_forward_queue_depth{status=pending|processing|dlq}
#   - retry_governor_pending_count{scheduler=outgoing|incoming-forward}
#   - retry_governor_effective_batch{scheduler=...}
#   - retry_governor_consecutive_failures{scheduler=...}
#   - retry_governor_cooldown_remaining{scheduler=...}
#   - webhook_dlq_depth{topic=deliveries.dlq}
#   - webhook_delivery_attempts_total{result=success|failure|error}
#   - circuit_breaker_state_transitions_total
#   - circuit_breaker_rejected_total
#   - http_server_requests_seconds_count{status=~"5.."}
#   - outbox_queue_depth{status=pending|sending|failed|dead}  (OutboxPublisherService, API)

groups:
  # ── Outbox ───────────────────────────────────────────────────
  - name: hookflow.outbox
    rules:
      # P1-24c: SENDING rows are recovered on the 30s retry cycle after
      # outbox.publisher.sending-recovery-seconds (default 300s). Sustained SENDING depth means
      # recovery isn't keeping up (or is failing outright) — those messages are undelivered
      # webhooks sitting invisibly until recovered.
      - alert: OutboxSendingStuck
        expr: |
          outbox_queue_depth{status="sending"} > 0
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} outbox messages stuck SENDING for >10m"
          description: |
            Outbox messages have been SENDING for longer than
            outbox.publisher.sending-recovery-seconds (default 300s) plus the 30s retry-cycle
            poll — recovery back to PENDING should already have happened. Check API logs for
            recoverStuckSendingMessages() and Kafka broker health.

groups:
  # ── Retry Backlog ────────────────────────────────────────────
  - name: hookflow.retry_backlog
    rules:
      # Pending delivery queue growing fast (>500 increase in 15 min)
      - alert: DeliveryPendingBacklogGrowing
        expr: |
          delta(delivery_queue_depth{status="pending"}[15m]) > 500
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Delivery pending backlog growing rapidly"
          description: |
            Pending deliveries increased by {{ $value | printf "%.0f" }} in 15 min.
            Check downstream endpoint health and worker scaling.

      # Pending deliveries above absolute threshold
      - alert: DeliveryPendingBacklogHigh
        expr: |
          delivery_queue_depth{status="pending"} > 5000
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Delivery pending backlog above 5000"
          description: |
            {{ $value | printf "%.0f" }} deliveries pending for >10 min.
            Consider scaling workers or investigating failing endpoints.

      # Critical: pending backlog above hard threshold
      - alert: DeliveryPendingBacklogCritical
        expr: |
          delivery_queue_depth{status="pending"} > 20000
        for: 5m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "CRITICAL: Delivery pending backlog above 20000"
          description: |
            {{ $value | printf "%.0f" }} deliveries pending.
            Hard-cap auto-DLQ escalation (DELIVERY_ESCALATION_HARD_CAP_HOURS, default 96h) may
            trigger for the oldest of these. Immediate investigation required.

      # Incoming forward pending backlog
      - alert: IncomingForwardPendingBacklogHigh
        expr: |
          incoming_forward_queue_depth{status="pending"} > 3000
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Incoming forward pending backlog above 3000"
          description: |
            {{ $value | printf "%.0f" }} incoming forwards pending for >10 min.

  # ── DLQ ──────────────────────────────────────────────────────
  - name: hookflow.dlq
    rules:
      # DLQ depth growing
      - alert: DlqDepthGrowing
        expr: |
          delta(delivery_queue_depth{status="dlq"}[1h]) > 100
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "DLQ growing: {{ $value | printf \"%.0f\" }} new entries in 1h"
          description: |
            DLQ entries increasing. Check endpoint availability and delivery logs.

      # DLQ rate above SLO threshold (>3% of deliveries)
      - alert: DlqRateHigh
        expr: |
          (
            rate(webhook_delivery_attempts_total{result="error"}[1h])
            + rate(webhook_delivery_attempts_total{result="failure"}[1h])
          )
          /
          rate(webhook_delivery_attempts_total[1h])
          > 0.1
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Delivery failure rate above 10% for >10 min"
          description: |
            {{ $value | printf "%.1f" }}% failure rate. SLO target: <5% DLQ rate.

      # Kafka DLQ topic depth
      - alert: KafkaDlqTopicNotEmpty
        expr: |
          webhook_dlq_depth > 0
        for: 30m
        labels:
          severity: info
          component: worker
        annotations:
          summary: "Kafka DLQ topic contains {{ $value | printf \"%.0f\" }} messages"
          description: |
            Messages in DLQ topic may need manual replay or investigation.

  # ── Retry Governor ───────────────────────────────────────────
  - name: hookflow.retry_governor
    rules:
      # Governor in sustained cooldown (indicating persistent downstream failures)
      - alert: RetryGovernorCooldown
        expr: |
          retry_governor_cooldown_remaining > 0
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Retry governor {{ $labels.scheduler }} in cooldown"
          description: |
            Governor entered cooldown after sustained failures.
            Cooldown remaining: {{ $value }} polls. Check downstream health.

      # Consecutive failures above threshold
      - alert: RetryGovernorConsecutiveFailures
        expr: |
          retry_governor_consecutive_failures > 5
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "Retry governor {{ $labels.scheduler }}: {{ $value }} consecutive failures"
          description: |
            Persistent Kafka send failures or downstream unavailability.
            Check Kafka broker health, worker logs, and network connectivity.

  # ── Circuit Breaker ──────────────────────────────────────────
  - name: hookflow.circuit_breaker
    rules:
      # Many circuit breakers tripping
      - alert: CircuitBreakerTripsHigh
        expr: |
          rate(circuit_breaker_state_transitions_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Circuit breakers tripping frequently"
          description: |
            {{ $value | printf "%.1f" }} circuit breaker transitions/sec.
            Multiple endpoints may be failing. Check endpoint health dashboard.

      # High rejection rate
      - alert: CircuitBreakerRejectionsHigh
        expr: |
          rate(circuit_breaker_rejected_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Circuit breaker rejecting >10 calls/sec"
          description: |
            Many deliveries being skipped due to open circuit breakers.

  # ── API Availability (from SLOs) ─────────────────────────────
  - name: hookflow.api
    rules:
      - alert: ApiErrorRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count[5m]))
          > 0.005
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API 5xx error rate above 0.5%"
          description: |
            {{ $value | printf "%.2f" }}% of requests returning 5xx.
            SLO target: <0.1% over 30d. Investigate API logs immediately.

  # ── Oldest Pending Age ───────────────────────────────────────
  - name: hookflow.staleness
    rules:
      # Oldest pending delivery is stale (metric exposed by StaleDeliveryEscalationService)
      - alert: OldestPendingDeliveryStale
        expr: |
          delivery_oldest_pending_age_seconds > 3600
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Oldest pending delivery is {{ $value | printf \"%.0f\" }}s old"
          description: |
            A delivery has been pending for over 1 hour.
            This may indicate a stuck delivery or scheduler issue.

      # P1-24a: threshold tracks DELIVERY_ESCALATION_HARD_CAP_HOURS (default 96h) plus a margin
      # for the 5-minute escalation poll interval — below the cap, a PENDING delivery may
      # legitimately still be working through the retry ladder (worst case ~83h with jitter),
      # so alerting at 24h as before would fire on healthy in-flight retries.
      - alert: OldestPendingDeliveryCritical
        expr: |
          delivery_oldest_pending_age_seconds > 349200
        for: 5m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "CRITICAL: Pending delivery stuck for >97h"
          description: |
            A delivery has been in PENDING state for {{ $value | printf "%.0f" }}s, past
            DELIVERY_ESCALATION_HARD_CAP_HOURS (default 96h) plus escalation-poll margin.
            Hard-cap escalation should have moved this to DLQ by now — investigate immediately
            (e.g. StaleDeliveryEscalationService not running, or stuck on an error).
