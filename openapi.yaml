components:
  schemas:
    WebhookCaptureResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        requestId:
          type: string
        receivedAt:
          type: string
        error:
          type: string
        challenge:
          type: string
    ProjectRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 2
          type: string
        description:
          maxLength: 500
          minLength: 0
          type: string
        schemaValidationEnabled:
          type: boolean
        schemaValidationPolicy:
          type: string
        idempotencyPolicy:
          type: string
    AuthContext:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - OWNER
          - DEVELOPER
          - VIEWER
          - API_KEY
        apiKeyProjectId:
          type: string
          format: uuid
        apiKeyScope:
          type: string
          enum:
          - READ_WRITE
          - READ_ONLY
        apiKey:
          type: boolean
    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        schemaValidationEnabled:
          type: boolean
        schemaValidationPolicy:
          type: string
        idempotencyPolicy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkflowRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 0
          type: string
        description:
          maxLength: 2000
          minLength: 0
          type: string
        enabled:
          type: boolean
        definition:
          type: object
        triggerType:
          type: string
          enum:
          - WEBHOOK_EVENT
          - MANUAL
          - SCHEDULE
        triggerConfig:
          type: object
    WorkflowResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        definition:
          type: object
        triggerType:
          type: string
          enum:
          - WEBHOOK_EVENT
          - MANUAL
          - SCHEDULE
        triggerConfig:
          type: object
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        totalExecutions:
          type: integer
          format: int64
        successfulExecutions:
          type: integer
          format: int64
        failedExecutions:
          type: integer
          format: int64
    TransformationRequest:
      required:
      - name
      - template
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 0
          type: string
          description: Human-readable name for the transformation
          example: Stripe v2 → CRM v1
        description:
          maxLength: 4096
          minLength: 0
          type: string
          description: Description of what this transformation does
          example: Normalizes Stripe payment events to CRM format
        template:
          maxLength: 65536
          minLength: 0
          type: string
          description: "JSON template with ${$.jsonpath} expressions for field mapping"
          example: "{\"event_type\":\"${$.type}\",\"amount\":\"${$.data.amount}\"}"
        enabled:
          type: boolean
          description: Whether this transformation is active
          example: true
      description: Request to create or update a transformation
    TransformationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        template:
          type: string
        version:
          type: integer
          format: int32
        enabled:
          type: boolean
        subscriptionCount:
          type: integer
          format: int64
        destinationCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubscriptionRequest:
      required:
      - endpointId
      - eventType
      type: object
      properties:
        endpointId:
          type: string
          format: uuid
        eventType:
          pattern: "^(\\*{1,2}|[a-z][a-z0-9_]*)(\\.([a-z][a-z0-9_]*|\\*{1,2}))*$"
          type: string
        enabled:
          type: boolean
        orderingEnabled:
          type: boolean
        maxAttempts:
          maximum: 20
          minimum: 1
          type: integer
          format: int32
        timeoutSeconds:
          maximum: 60
          minimum: 1
          type: integer
          format: int32
        retryDelays:
          type: string
        payloadTemplate:
          type: string
        customHeaders:
          type: string
        transformationId:
          type: string
          format: uuid
    SubscriptionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        endpointId:
          type: string
          format: uuid
        eventType:
          type: string
        enabled:
          type: boolean
        orderingEnabled:
          type: boolean
        maxAttempts:
          type: integer
          format: int32
        timeoutSeconds:
          type: integer
          format: int32
        retryDelays:
          type: string
        payloadTemplate:
          type: string
        customHeaders:
          type: string
        transformationId:
          type: string
          format: uuid
        transformationName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventTypeCatalogRequest:
      required:
      - name
      type: object
      properties:
        name:
          pattern: "^[a-z][a-z0-9_.]*$"
          type: string
        description:
          type: string
    EventTypeCatalogResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        latestVersion:
          type: integer
          format: int32
        activeVersionStatus:
          type: string
        hasBreakingChanges:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConditionNode:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
    Group:
      type: object
      allOf:
      - $ref: '#/components/schemas/ConditionNode'
      - type: object
        properties:
          op:
            type: string
            enum:
            - AND
            - OR
            - NOT
          children:
            type: array
            items:
              $ref: '#/components/schemas/ConditionNode'
    Predicate:
      type: object
      allOf:
      - $ref: '#/components/schemas/ConditionNode'
      - type: object
        properties:
          field:
            type: string
          operator:
            type: string
            enum:
            - EQ
            - NEQ
            - CONTAINS
            - NOT_CONTAINS
            - STARTS_WITH
            - ENDS_WITH
            - IN
            - NOT_IN
            - REGEX
            - GT
            - GTE
            - LT
            - LTE
            - BETWEEN
            - EXISTS
            - NOT_EXISTS
            - IS_NULL
            - NOT_NULL
          value:
            type: object
          valueType:
            type: string
            enum:
            - STRING
            - NUMBER
            - BOOLEAN
            - ARRAY_STRING
            - ARRAY_NUMBER
            - DATE_TIME
          caseInsensitive:
            type: boolean
    RuleActionRequest:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          enum:
          - ROUTE
          - TRANSFORM
          - DROP
          - TAG
        endpointId:
          type: string
          format: uuid
        transformationId:
          type: string
          format: uuid
        config:
          type: object
        sortOrder:
          type: integer
          format: int32
    RuleRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 0
