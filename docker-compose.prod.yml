# ============================================================================
# Production overrides for Webhook Platform
# ============================================================================
# Usage (via Makefile — recommended):
#   make up-prod              (embedded DB)
#   make up-prod-external     (external/managed DB)
#
# Manual usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# Pre-built images (P1-15):
#   Defaults to this project's own published images — ghcr.io/vadymkykalo/hookflow-*
#   (built + pushed by .github/workflows/docker-publish.yml on every version tag).
#   Point DOCKER_REGISTRY at your own mirror/fork instead if you rebuild and
#   republish these images yourself, e.g.:
#     DOCKER_REGISTRY=ghcr.io/yourorg/webhook-platform
#   Images then resolve to:
#     ghcr.io/yourorg/webhook-platform-api:latest
#     ghcr.io/yourorg/webhook-platform-worker:latest
#     ghcr.io/yourorg/webhook-platform-ui:latest
#
# This file overrides the base docker-compose.yml with production settings:
#   - Uses pre-built images from registry (run with --no-build)
#   - Stricter security (no Swagger, no private IPs, SSL for DB)
#   - API port not exposed publicly (traffic goes through UI nginx proxy)
#   - Production-safe log levels and email enabled
#
# Resource limits / replica counts: this file is an *overlay* merged on top of
# docker-compose.yml (`-f docker-compose.yml -f docker-compose.prod.yml`), and
# the base file already sets `deploy.resources.limits` per service — merging
# doesn't drop them, so they don't need to be repeated here despite this file's
# name. Plain `docker compose up` (no Swarm) has no `deploy.replicas` concept;
# scale with `docker compose ... up --scale worker=3` or `make scale-worker` /
# `make scale-api`. For a from-scratch, no-clone-required pull path (no base
# file, no toolchain, just this repo's docker-compose.pull.yml + .env.dist),
# see docker-compose.pull.yml instead — it's a fully standalone file rather
# than an overlay, because that's the scenario where a would-be user has
# *only* the compose file and .env.dist, not the rest of the repo.

services:
  api:
    image: ${DOCKER_REGISTRY:-ghcr.io/vadymkykalo/hookflow}-api:${API_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      SPRING_PROFILES_ACTIVE: production
      SWAGGER_ENABLED: "false"
      WEBHOOK_ALLOW_PRIVATE_IPS: "false"
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      LOG_LEVEL: ${LOG_LEVEL:-WARN}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      ALERTS_NOTIFICATIONS_ENABLED: ${ALERTS_NOTIFICATIONS_ENABLED:-true}
      # Traffic reaches this API container via the UI nginx proxy over the compose
      # network, not directly — trust that proxy's docker-network peer address so
      # X-Forwarded-For (which nginx sets) is honoured for rate limiting / audit
      # logging. Narrow this to your actual proxy/LB address if you don't use the
      # default docker-compose bridge network.
      WEBHOOK_TRUSTED_PROXIES: ${WEBHOOK_TRUSTED_PROXIES:-172.16.0.0/12}

  worker:
    image: ${DOCKER_REGISTRY:-ghcr.io/vadymkykalo/hookflow}-worker:${WORKER_IMAGE_TAG:-latest}
    environment:
      APP_ENV: production
      SPRING_PROFILES_ACTIVE: production
      WEBHOOK_ALLOW_PRIVATE_IPS: "false"
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      LOG_LEVEL: ${LOG_LEVEL:-WARN}

  ui:
    image: ${DOCKER_REGISTRY:-ghcr.io/vadymkykalo/hookflow}-ui:${UI_IMAGE_TAG:-latest}
